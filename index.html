<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi página</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --fondo: #f4f6f8;
            --tinta: #1b2430;
            --marino: #10202b;
            --acento: #0f8b8d;
            --acento-oscuro: #0b6b6d;
        }

        body {
            font-family: "Manrope", system-ui, sans-serif;
            background: var(--fondo);
            color: var(--tinta);
        }

        .navbar {
            background: var(--marino);
        }

        .navbar .nav-link {
            color: #c9d4dc;
            padding: .5rem 1rem;
            border-radius: .5rem;
        }

        .navbar .nav-link:hover,
        .navbar .nav-link:focus-visible {
            color: #fff;
            background: rgba(255, 255, 255, .08);
        }

        .navbar .nav-link.active {
            color: #fff;
            font-weight: 600;
            box-shadow: inset 0 -3px 0 var(--acento);
            border-radius: 0;
        }

        .hero {
            background: var(--marino);
            color: #fff;
            padding: 4rem 0 6rem;
        }

        .hero h1 {
            font-weight: 800;
            font-size: clamp(2rem, 5vw, 3.25rem);
            letter-spacing: -.02em;
            max-width: 18ch;
        }

        .hero p {
            color: #b8c6d0;
            max-width: 52ch;
            font-size: 1.125rem;
        }

        .btn-acento {
            background: var(--acento);
            border-color: var(--acento);
            color: #fff;
            font-weight: 600;
        }

        .btn-acento:hover,
        .btn-acento:focus-visible {
            background: var(--acento-oscuro);
            border-color: var(--acento-oscuro);
            color: #fff;
        }

        .btn-borde {
            border-color: #4d6272;
            color: #e3ebf0;
            font-weight: 600;
        }

        .btn-borde:hover,
        .btn-borde:focus-visible {
            background: rgba(255, 255, 255, .1);
            color: #fff;
        }

        .video-caja {
            margin-top: -4rem;
            max-width: 860px;
        }

        .video-caja .ratio {
            border-radius: .75rem;
            overflow: hidden;
            box-shadow: 0 12px 32px rgba(16, 32, 43, .25);
            background: #000;
        }

        footer {
            color: #5b6875;
            font-size: .9rem;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-sm" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Mi página</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="columnas.html">Columnas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="tarjetas.html">Tarjetas</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="hero">
        <div class="container">
            <h1>Mi práctica con Bootstrap</h1>
            <p class="mt-3">Aquí voy probando columnas, tarjetas y otros componentes. Mira el video y luego revisa las
                otras páginas.</p>
            <div class="d-flex flex-wrap gap-2 mt-4">
                <a class="btn btn-acento btn-lg" href="columnas.html">Ver columnas</a>
                <a class="btn btn-borde btn-lg" href="tarjetas.html">Ver tarjetas</a>
            </div>
        </div>
    </header>

    <main class="container video-caja px-3">
        <div class="ratio ratio-16x9">
            <iframe src="https://www.youtube.com/embed/EQH2Pb8FTac?si=WzUKZ6unTM5gTS4p" title="Video de YouTube"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
    </main>

    <footer class="container text-center py-5">
        Hecho con Bootstrap 5
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
